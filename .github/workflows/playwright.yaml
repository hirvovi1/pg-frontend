name: Playwright Tests
on:
  push:
    branches: [ main, test-ci-sandbox, dev ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@v2

      # 1. Pull the React frontend code (this repository)
      - name: Checkout frontend
        uses: actions/checkout@v7

      # 2. Pull Core Java Backend (Port 8080 & H2)
      - name: Checkout core backend api
        uses: actions/checkout@v7
        with:
          repository: 'hirvovi1/pgapi'
          ref: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'main' }}
          path: pgapi

      # 3. Pull Microservice Monorepo (Port 8090 & 8095)
      - name: Checkout microservices monorepo
        uses: actions/checkout@v7
        with:
          repository: 'hirvovi1/pg-backend-platform'
          ref: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'main' }}
          path: pg-backend-platform

      # 4. Set up JDK 25 environment so the monorepo can execute ./mvnw safely
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 5. Create a shared Docker network for inter-container communication
      - name: Create Shared Docker Network with Labels
        run: |
          docker network create \
            --label "com.docker.compose.network=mock-payment-network" \
            mock-payment-network

      # 10. Node setup and dependency injection execution
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 11. Execute E2E Suite against the full live mesh
      - name: Run Playwright tests
        run: npx playwright test --workers=1
        env:
          REACT_APP_API_URL: http://localhost:8080

      # 13. Save output artifact trace packages
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
