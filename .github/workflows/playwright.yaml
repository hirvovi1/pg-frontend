name: Playwright Tests
on:
  push:
    branches: [ main, master, test-ci-sandbox ]
  pull_request:
    branches: [ main, master, test-ci-sandbox ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the React frontend code (this repository)
    - name: Checkout frontend
      uses: actions/checkout@v4

    # 2. Pull Core Java Backend (Port 8080 & H2)
    - name: Checkout core backend api
      uses: actions/checkout@v4
      with:
        repository: 'hirvovi1/pgapi'
        path: pgapi

    # 3. Pull Microservice Monorepo (Port 8090 & 8095)
    - name: Checkout microservices monorepo
      uses: actions/checkout@v4
      with:
        repository: 'hirvovi1/pg-backend-platform'
        path: pg-backend-platform

    # 4. Set up JDK 25 environment so the monorepo can execute ./mvnw safely
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # 5. Start Core Backend Engine (Port 8080)
    - name: Start Core Backend Engine
      run: docker compose -f pgapi/compose.yaml up --build -d

    # 6. Start Microservices Stack (Ports 8090 & 8095)
    - name: Start Microservices Stack
      run: docker compose -f pg-backend-platform/docker-compose.yaml up --build -d

    # 7. Comprehensive Cluster Health Verification
    - name: Wait for All Services to be ready
      run: |
          set -euo pipefail

          wait_for_service() {
            local service_name="$1"
            local url="$2"
            local attempts=30

            for ((attempt = 1; attempt <= attempts; attempt++)); do
              http_code="$(curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$url" || true)"

              # A 2xx response proves the application endpoint is available.
              # --max-time is expected for the long-lived SSE endpoint; curl
              # still writes the received HTTP status before timing out.
              if [[ "$http_code" =~ ^2[0-9]{2}$ ]]; then
                echo "$service_name is ready (HTTP $http_code)."
                return 0
              fi

              printf 'Waiting for %s (%d/%d)...\n' "$service_name" "$attempt" "$attempts"
              sleep 4
            done

            echo "Timed out waiting for $service_name at $url" >&2
            return 1
          }

          wait_for_service "Core Backend API" "http://localhost:8080/accounts"
          wait_for_service "Health Pulse monitor" "http://localhost:8095/api/pulse/stream"
          echo "Entire cluster network mesh is active and responding!"

    # 8. Dump execution environment states on failures
    - name: Dump Core Backend logs on failure
      if: always()
      run: docker compose -f pgapi/compose.yaml logs

    - name: Dump Microservices logs on failure
      if: always()
      run: docker compose -f pg-backend-platform/docker-compose.yaml logs
    
    # 9. Node setup and dependency injection execution
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 10. Execute E2E Suite against the full live mesh
    - name: Run Playwright tests
      run: npx playwright test
      env:
        REACT_APP_API_URL: http://localhost:8080

    # 11. Graceful cluster cleanup
    - name: Stop Core Backend containers
      if: always()
      run: docker compose -f pgapi/compose.yaml down

    - name: Stop Microservices containers
      if: always()
      run: docker compose -f pg-backend-platform/docker-compose.yaml down

    # 12. Save output artifact trace packages
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 3
