name: PR Dependencies

on:
  pull_request:
    types: [opened, edited, synchronized, reopened]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR dependencies
        uses: zentered/github-action-pr-dependencies@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
